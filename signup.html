<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 웹 채팅</title>
    <link rel="stylesheet" href="auth-style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="form-header">
                <div class="app-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    <span>웹 채팅</span>
                </div>
                <h2 class="form-title">새로운 시작을 환영합니다!</h2>
                <p class="form-subtitle">지금 가입하고 친구들과 소통하세요</p>
            </div>

            <form id="signup-form" class="auth-form" novalidate>
                <div class="photo-upload-section">
                    <div class="photo-preview-container" role="button" tabindex="0" aria-label="프로필 사진 업로드">
                        <img id="photo-preview" class="photo-preview" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCIgdmlld0JveD0iMCAwIDgwIDgwIj4KICAgIDxjaXJjbGUgY3g9IjQwIiBjeT0iNDAiIHI9IjQwIiBmaWxsPSIjZjNmMmYxIi8+CiAgICA8cGF0aCBkPSJtNDAgNDhjLTEwLjUgMC0yMCA1LjMtMjAgMTIgMCAyLjIgMS44IDQgNCA0aDMyYzIuMiAwIDQtMS44IDQtNCAwLTYuNy05LjUtMTItMjAtMTJ6bTAtMjhjLTYuNiAwLTEyIDUuNC0xMiAxMnM1LjQgMTIgMTIgMTIgMTItNS40IDEyLTEyLTUuNC0xMi0xMi0xMnoiIGZpbGw9IiNjYWNhY2EiLz4KPC9zdmc+" alt="프로필 사진 미리보기">
                        <div class="photo-upload-overlay">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-camera"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
                        </div>
                    </div>
                    <input type="file" id="photo-input" class="photo-input" accept="image/*" hidden>
                    <div class="form-group">
                        <label for="photo-url-input" class="form-label">또는 이미지 URL 입력</label>
                        <input type="url" id="photo-url-input" class="form-input" placeholder="https://example.com/image.jpg">
                    </div>
                </div>

                <div class="form-group">
                    <label for="name-input" class="form-label">이름 *</label>
                    <input type="text" id="name-input" class="form-input" placeholder="표시될 이름을 입력하세요" required minlength="2" maxlength="20" aria-required="true">
                </div>

                <div class="form-group">
                    <label for="email-input" class="form-label">이메일 *</label>
                    <input type="email" id="email-input" class="form-input" placeholder="your@email.com" required aria-required="true">
                </div>
                
                <div class="form-group">
                    <label for="password-input" class="form-label">비밀번호 *</label>
                    <div class="input-wrapper">
                        <input type="password" id="password-input" class="form-input" placeholder="비밀번호를 입력하세요" required minlength="6" aria-required="true">
                        <button type="button" class="password-toggle" id="password-toggle-1" aria-label="비밀번호 보기/숨기기">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <div class="password-strength" id="password-strength">
                        <div class="strength-bar"><div class="strength-fill"></div></div>
                        <span class="strength-text">비밀번호 강도</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password-input" class="form-label">비밀번호 확인 *</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirm-password-input" class="form-input" placeholder="비밀번호를 다시 입력하세요" required minlength="6" aria-required="true">
                        <button type="button" class="password-toggle" id="password-toggle-2" aria-label="비밀번호 확인 보기/숨기기">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="checkbox-wrapper" for="terms-agreement">
                        <input type="checkbox" id="terms-agreement" required aria-required="true">
                        <span class="checkbox-custom" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check"><path d="M20 6 9 17l-5-5"/></svg>
                        </span>
                        <span class="checkbox-label">
                            <a href="#" class="auth-link">이용약관</a> 및 
                            <a href="#" class="auth-link">개인정보처리방침</a>에 동의합니다
                        </span>
                    </label>
                </div>

                <button type="submit" class="btn-primary">
                    <span class="btn-text">계정 만들기</span>
                </button>

                <div id="auth-error" class="error-message" role="alert"></div>
            </form>

            <div class="auth-footer">
                <p>
                    이미 계정이 있으신가요?
                    <a href="login.html" class="auth-link">로그인</a>
                </p>
            </div>
        </div>
    </div>
    <script src="signup.js"></script>
</body>
</html>
