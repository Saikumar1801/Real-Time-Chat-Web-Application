<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 웹 채팅</title>
    <link rel="stylesheet" href="auth-style.css">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js"></script>
</head>
<body>
    <div class="auth-container">
        <!-- Background Elements -->
        <div class="background-decoration">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>

        <!-- Main Content -->
        <div class="auth-wrapper">
            <!-- Left Side - Branding -->
            <div class="auth-brand-section">
                <div class="brand-content">
                    <div class="app-logo">
                        <div class="logo-icon">💬</div>
                        <h1 class="app-title">웹 채팅</h1>
                    </div>
                    <h2 class="welcome-title">다시 만나서 반가워요!</h2>
                    <p class="welcome-subtitle">친구들과 실시간으로 대화를 나누세요</p>
                    <div class="feature-list">
                        <div class="feature-item">
                            <span class="feature-icon">⚡</span>
                            <span>실시간 메시징</span>
                        </div>
                        <div class="feature-item">
                            <span class="feature-icon">🔒</span>
                            <span>안전한 대화</span>
                        </div>
                        <div class="feature-item">
                            <span class="feature-icon">👥</span>
                            <span>그룹 채팅</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Side - Login Form -->
            <div class="auth-form-section">
                <div class="form-container">
                    <div class="form-header">
                        <h2 class="form-title">로그인</h2>
                        <p class="form-subtitle">계정에 로그인하여 대화를 시작하세요</p>
                    </div>

                    <!-- Login Form -->
                    <form id="login-form" class="auth-form">
                        <div class="form-group">
                            <label for="login-email" class="form-label">이메일</label>
                            <div class="input-wrapper">
                                <input 
                                    type="email" 
                                    id="login-email" 
                                    class="form-input" 
                                    placeholder="your@email.com"
                                    required
                                >
                                <span class="input-icon">📧</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="login-password" class="form-label">비밀번호</label>
                            <div class="input-wrapper">
                                <input 
                                    type="password" 
                                    id="login-password" 
                                    class="form-input" 
                                    placeholder="비밀번호를 입력하세요"
                                    required
                                >
                                <span class="input-icon">🔒</span>
                                <button type="button" class="password-toggle" id="password-toggle">
                                    <span class="toggle-icon">👁️</span>
                                </button>
                            </div>
                        </div>

                        <div class="form-options">
                            <label class="checkbox-wrapper">
                                <input type="checkbox" id="remember-me">
                                <span class="checkbox-custom"></span>
                                <span class="checkbox-label">로그인 상태 유지</span>
                            </label>
                            <a href="#" class="forgot-password">비밀번호를 잊으셨나요?</a>
                        </div>

                        <button type="submit" class="btn-primary">
                            <span class="btn-text">로그인</span>
                            <div class="btn-loader hidden">
                                <div class="spinner"></div>
                            </div>
                        </button>

                        <div id="auth-error" class="error-message"></div>
                    </form>

                    <!-- Divider -->
                    <div class="auth-divider">
                        <span>또는</span>
                    </div>

                    <!-- Guest Form -->
                    <form id="guest-form" class="guest-form">
                        <div class="form-group">
                            <label for="guest-name" class="form-label">게스트 이름</label>
                            <div class="input-wrapper">
                                <input 
                                    type="text" 
                                    id="guest-name" 
                                    class="form-input" 
                                    placeholder="표시될 이름을 입력하세요"
                                    minlength="2"
                                    maxlength="20"
                                    required
                                >
                                <span class="input-icon">👤</span>
                            </div>
                            <div class="input-hint">2-20자 사이로 입력해주세요</div>
                        </div>

                        <button type="submit" class="btn-secondary">
                            <span class="btn-text">게스트로 참여하기</span>
                            <div class="btn-loader hidden">
                                <div class="spinner"></div>
                            </div>
                        </button>
                    </form>

                    <!-- Bottom Links -->
                    <div class="auth-footer">
                        <p class="auth-link-text">
                            계정이 없으신가요?
                            <a href="signup.html" class="auth-link">회원가입</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
