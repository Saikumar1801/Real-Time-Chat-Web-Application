<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 웹 채팅</title>
    <link rel="stylesheet" href="auth-style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="form-header">
                <div class="app-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    <span>웹 채팅</span>
                </div>
                <h2 class="form-title">다시 만나서 반가워요!</h2>
                <p class="form-subtitle">계정에 로그인하여 대화를 시작하세요</p>
            </div>

            <form id="login-form" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="login-email" class="form-label">이메일</label>
                    <div class="input-wrapper">
                        <input type="email" id="login-email" class="form-input" placeholder="your@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="login-password" class="form-label">비밀번호</label>
                    <div class="input-wrapper">
                        <input type="password" id="login-password" class="form-input" placeholder="비밀번호를 입력하세요" required>
                        <button type="button" class="password-toggle" id="password-toggle">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="remember-me">
                        <span class="checkbox-custom">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check"><path d="M20 6 9 17l-5-5"/></svg>
                        </span>
                        <span class="checkbox-label">로그인 상태 유지</span>
                    </label>
                    <a href="#" class="auth-link">비밀번호 찾기</a>
                </div>

                <button type="submit" class="btn-primary">
                    <span class="btn-text">로그인</span>
                </button>

                <div id="auth-error" class="error-message"></div>
            </form>

            <div class="auth-divider"><span>또는</span></div>

            <form id="guest-form" class="auth-form">
                <div class="form-group">
                    <label for="guest-name" class="form-label">게스트 이름</label>
                    <div class="input-wrapper">
                        <input type="text" id="guest-name" class="form-input" placeholder="표시될 이름을 입력하세요" minlength="2" maxlength="20" required>
                    </div>
                    <div class="input-hint">2-20자 사이로 입력해주세요</div>
                </div>
                <button type="submit" class="btn-secondary">
                    <span class="btn-text">게스트로 참여하기</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>
                    계정이 없으신가요?
                    <a href="signup.html" class="auth-link">회원가입</a>
                </p>
            </div>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
