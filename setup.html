<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 설정</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main container for the setup form -->
    <div class="setup-container">
        
        <!-- Header text -->
        <h1>채팅 시작하기</h1>
        <p>다른 사용자에게 보여질 이름을 입력해주세요.</p>

        <!-- Form to capture the user's name -->
        <form id="name-form">
            <input type="text" id="name-input" placeholder="이름을 입력하세요" required minlength="2">
            <button type="submit" class="setup-button">채팅 시작</button>
        </form>

        <!-- Div to show any potential errors -->
        <div id="setup-error" class="error-message"></div>
    </div>

    <!-- 
        Firebase SDKs: These scripts provide the necessary Firebase functionality
        for Authentication and the Firestore Database, which are needed to 
        update the user's profile.
    -->
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
    
    <!-- The JavaScript logic that handles this page -->
    <script src="setup.js"></script>
</body>
</html>
