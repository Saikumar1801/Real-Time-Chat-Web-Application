<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 채팅</title>
    <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="offline-banner">오프라인 상태입니다. 연결을 확인해주세요.</div>

    <div class="app-container">
        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <div class="header-top-row">
                    <div class="header-profile-area">
                        <button id="profile-btn" class="icon-button" title="내 프로필 보기" aria-label="내 프로필 보기">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-user-round"><path d="M18 20a6 6 0 0 0-12 0"/><circle cx="12" cy="10" r="4"/><circle cx="12" cy="12" r="10"/></svg>
                        </button>
                        <h1>채팅</h1>
                    </div>
                    <div class="header-actions">
                         <button id="private-chat-btn" class="icon-button" title="1:1 채팅 시작" aria-label="1:1 채팅 시작">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-plus"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
                        </button>
                        <button id="new-room-btn" class="icon-button" title="새 그룹 생성" aria-label="새 그룹 생성">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-pen"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4Z"/></svg>
                        </button>
                    </div>
                </div>
                <div class="search-actions-row">
                     <div class="search-bar-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                        <input type="search" id="search-bar" placeholder="채팅방 검색...">
                     </div>
                     <button id="dark-mode-toggle" class="icon-button" title="테마 변경" aria-label="테마 변경">
                           <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                           <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                     </button>
                </div>
                 <div class="sidebar-actions">
                     <button id="join-room-btn" class="sidebar-action-button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-link"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.72"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.72-1.72"/></svg>
                        <span>ID로 그룹 참여</span>
                    </button>
                    <button id="invitations-btn" class="sidebar-action-button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mail"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                        <span>초대 목록</span>
                    </button>
                     <button id="admin-panel-btn" class="sidebar-action-button" style="display: none;">
                       <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-check"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg>
                        <span>관리자 패널</span>
                    </button>
                 </div>
            </header>
            <main class="room-list">
                <div class="loading-spinner"></div>
            </main>
        </aside>

        <!-- ===== CHAT AREA ===== -->
        <main class="chat-area">
            <div class="chat-placeholder">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="placeholder-icon lucide lucide-message-square-text"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <h2>채팅을 시작하세요</h2>
                <p>왼쪽 목록에서 채팅을 선택해주세요.</p>
            </div>
            <div class="chat-view" style="display: none;">
                <header class="chat-header">
                    <button class="back-button mobile-only icon-button" aria-label="뒤로가기">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                    </button>
                    <div class="room-info" title="채팅방 정보 보기">
                        <h1 class="room-title"></h1>
                        <p class="room-status"></p> 
                    </div>
                    <div class="chat-header-actions">
                        <div class="message-search-container">
                             <input type="search" id="message-search-input" class="message-search-input" placeholder="대화 검색...">
                             <button id="search-prev-btn" class="search-nav-btn" title="이전 결과" style="display:none;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-up"><path d="m18 15-6-6-6 6"/></svg>
                             </button>
                             <button id="search-next-btn" class="search-nav-btn" title="다음 결과" style="display:none;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down"><path d="m6 9 6 6 6-6"/></svg>
                             </button>
                        </div>
                        <button id="leave-room-btn" class="icon-button danger" title="채팅방 나가기" aria-label="채팅방 나가기">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-log-out"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                        </button>
                    </div>
                </header>

                <div id="pinned-message-container"></div>

                <section class="chat-messages"></section>

                <div id="reply-preview" class="reply-preview-area" style="display: none;">
                    <div class="reply-content">
                        <div class="reply-to"><strong></strong>님에게 답장</div>
                        <div class="reply-text"></div>
                    </div>
                    <button id="cancel-reply-btn" class="cancel-reply-btn" aria-label="답장 취소">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>

                <div id="emoji-picker" class="emoji-picker" style="display: none;"></div>

                <form class="chat-input-area">
                    <div class="attachment-buttons">
                         <button type="button" class="icon-button" id="emoji-btn" title="이모티콘" aria-label="이모티콘">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-smile"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></svg>
                        </button>
                        <input type="file" id="image-input" accept="image/*" style="display: none;">
                        <button type="button" class="icon-button attach-button" id="image-attach-btn" title="사진 보내기" aria-label="사진 보내기">
                           <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-image"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                        </button>
                        <input type="file" id="file-input" style="display: none;">
                        <button type="button" class="icon-button attach-button" id="file-attach-btn" title="파일 보내기" aria-label="파일 보내기">
                           <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-paperclip"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.59a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                        </button>
                    </div>
                    <input type="text" class="message-input" placeholder="메시지 입력...">
                    <button type="submit" class="send-button icon-button" disabled aria-label="메시지 전송">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-send-horizontal"><path d="m3 3 3 9-3 9 19-9Z"/><path d="M6 12h16"/></svg>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- ===== MODALS ===== -->

    <!-- Room Info / Participant Modal -->
    <div id="participant-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title"></h2>
                <button class="modal-close-btn icon-button" aria-label="닫기">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div id="modal-room-id-container" class="modal-info-box" style="display: none;">
                    <span class="modal-info-label">채팅방 ID</span>
                    <div class="copyable-id-wrapper">
                        <span id="modal-room-id-text"></span>
                        <button id="modal-room-id-copy-btn" class="copy-button" title="ID 복사" aria-label="ID 복사" data-field="roomId">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                        </button>
                    </div>
                </div>
                <div id="participant-list" class="modal-list"></div>
                <button id="media-gallery-btn" class="modal-button secondary" style="width: 100%; margin-top: 15px;">미디어 보기</button>
                <div id="admin-controls" style="display: none; margin-top: 20px;">
                    <h3>관리자 설정</h3>
                    <div class="modal-actions vertical">
                        <button id="add-member-btn" class="modal-button secondary">멤버 검색해서 추가</button>
                        <button id="edit-room-btn" class="modal-button">채팅방 이름 변경</button>
                        <button id="admin-delete-room-btn" class="modal-button danger">채팅방 삭제</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- User Profile Modal -->
    <div id="user-profile-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="user-profile-modal-title">프로필 정보</h2>
                <div>
                    <button class="icon-button" id="user-profile-edit-btn" title="프로필 수정" aria-label="프로필 수정" style="display: none;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pencil"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
                    </button>
                    <button class="modal-close-btn icon-button" id="user-profile-close-btn" aria-label="닫기">
                       <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>
            </div>
            <div class="modal-body">
                <div class="profile-header">
                    <div class="profile-photo-wrapper">
                        <img id="user-profile-photo" class="profile-photo" src="" alt="Profile Photo">
                        <label for="profile-photo-input" id="profile-photo-edit-overlay" style="display: none;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-camera"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
                        </label>
                        <input type="file" id="profile-photo-input" accept="image/*" style="display:none;">
                    </div>
                    <h2 id="user-profile-name-view"></h2>
                    <input type="text" id="user-profile-name-edit" class="profile-input" style="display:none;">
                    <p id="user-profile-status-view"></p>
                    <select id="user-profile-status-edit" class="profile-select" style="display:none;">
                        <option value="Online">Online</option>
                        <option value="Away">Away</option>
                        <option value="Do Not Disturb">Do Not Disturb</option>
                        <option value="Offline">Offline</option>
                    </select>
                </div>
                <div class="profile-details">
                    <div class="profile-field" id="profile-email-field">
                        <label>Email</label>
                        <div class="copyable-field">
                            <span id="user-profile-email-view"></span>
                            <input type="email" id="user-profile-email-edit" class="profile-input" style="display:none;">
                            <button class="copy-button" data-field="email" title="이메일 복사" aria-label="이메일 복사">
                               <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="profile-field" id="profile-phone-field">
                        <label>Phone</label>
                        <div class="copyable-field">
                            <span id="user-profile-phone-view"></span>
                            <input type="tel" id="user-profile-phone-edit" class="profile-input" style="display:none;">
                            <button class="copy-button" data-field="phone" title="전화번호 복사" aria-label="전화번호 복사">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="profile-field">
                        <label>User ID</label>
                        <div class="copyable-field">
                            <span id="user-profile-id"></span>
                            <button class="copy-button" data-field="id" title="사용자 ID 복사" aria-label="사용자 ID 복사">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div id="profile-modal-actions" class="modal-footer" style="display:none;">
                <button id="profile-cancel-btn" class="modal-button secondary">취소</button>
                <button id="profile-save-btn" class="modal-button primary">
                    <span class="btn-text">저장</span>
                    <div class="btn-loader hidden"><div class="spinner"></div></div>
                </button>
            </div>
            <div id="profile-modal-footer" class="modal-footer" style="display: none;">
                <button id="profile-logout-btn" class="modal-button danger">로그아웃</button>
            </div>
        </div>
    </div>
    
    <!-- Other Modals -->
    <div id="media-gallery-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
             <div class="modal-header">
                <h2>미디어 갤러리</h2>
                <button class="modal-close-btn icon-button" aria-label="닫기">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
            <div class="media-grid"></div>
        </div>
    </div>

    <div id="custom-prompt-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 id="custom-prompt-title"></h2>
            <p id="custom-prompt-text"></p>
            <input type="text" id="custom-prompt-input" style="display: none;">
            <div id="member-picker" style="display: none;">
                <input type="text" id="user-search" placeholder="사용자 검색..." class="search-input">
                <div id="search-results" class="search-results"></div>
                <div id="selected-members" class="selected-members"></div>
            </div>
            <div class="modal-actions">
                <button id="custom-prompt-cancel" class="modal-button secondary">취소</button>
                <button id="custom-prompt-ok" class="modal-button primary">
                     <span class="btn-text">확인</span>
                </button>
            </div>
        </div>
    </div>

    <div id="edit-message-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
             <div class="modal-header">
                <h2>메시지 수정</h2>
                <button class="modal-close-btn icon-button" aria-label="닫기" id="edit-modal-close-btn">
                     <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
            <form id="edit-message-form">
                <textarea id="edit-message-input" rows="4" required></textarea>
                <div class="modal-actions">
                    <button type="button" id="edit-message-cancel" class="modal-button secondary">취소</button>
                    <button type="submit" class="modal-button primary">저장</button>
                </div>
            </form>
        </div>
    </div>

    <div id="admin-panel-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>관리자 패널</h2>
                <button class="modal-close-btn icon-button" aria-label="닫기">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
