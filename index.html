<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 채팅</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="offline-banner">오프라인 상태입니다. 연결을 확인해주세요.</div>

    <div class="app-container">
        <aside class="sidebar">
            <header class="sidebar-header">
                <div class="header-top-row">
                    <div class="header-profile-area">
                        <button id="profile-btn" class="profile-button" title="내 프로필 보기">👤</button>
                        <h1>내 채팅</h1>
                    </div>
                    <div class="header-actions">
                        <button id="dark-mode-toggle" title="테마 변경">🌙</button>
                        <button id="private-chat-btn" class="header-button" title="1:1 채팅 시작">👤+</button>
                        <button id="join-room-btn" class="header-button" title="ID로 그룹 참여">🔗</button>
                        <button id="new-room-btn" class="header-button" title="새 그룹 생성">+</button>
                    </div>
                </div>
                <input type="search" id="search-bar" placeholder="채팅방 검색...">
            </header>
            <main class="room-list">
                <div class="loading-spinner"></div>
            </main>
        </aside>

        <main class="chat-area">
            <div class="chat-placeholder">
                <h2>채팅을 시작하세요</h2>
                <p>왼쪽 목록에서 채팅을 선택해주세요.</p>
            </div>
            <div class="chat-view" style="display: none;">
                <header class="chat-header">
                    <button class="back-button mobile-only">&lt;</button>
                    <div class="room-info" title="채팅방 정보 보기">
                        <h1 class="room-title"></h1>
                        <p class="room-status"></p> 
                    </div>
                    <div class="message-search-container">
                         <input type="search" id="message-search-input" class="message-search-input" placeholder="대화 검색...">
                    </div>
                    <button id="delete-room-btn" class="header-button danger" title="채팅방 나가기">🚪</button>
                </header>

                <div id="pinned-message-container"></div>

                <section class="chat-messages"></section>

                <div id="reply-preview" class="reply-preview-area" style="display: none;">
                    <div class="reply-content">
                        <div class="reply-to"><strong></strong>님에게 답장</div>
                        <div class="reply-text"></div>
                    </div>
                    <button id="cancel-reply-btn" class="cancel-reply-btn">&times;</button>
                </div>

                <form class="chat-input-area">
                    <input type="file" id="image-input" accept="image/*" style="display: none;">
                    <input type="file" id="file-input" style="display: none;">
                    <button type="button" class="attach-button" id="image-attach-btn" title="사진 보내기">🖼️</button>
                    <button type="button" class="attach-button" id="file-attach-btn" title="파일 보내기">📎</button>
                    <input type="text" class="message-input" placeholder="메시지 입력...">
                    <button type="submit" class="send-button">전송</button>
                </form>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="participant-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button id="modal-close-btn" class="modal-close-btn">&times;</button>
            <h2 id="modal-title"></h2>
            <div id="modal-room-id-container" class="modal-info-box" style="display: none;">
                <span class="modal-info-label">채팅방 ID</span>
                <div class="copyable-id-wrapper">
                    <span id="modal-room-id-text"></span>
                    <button id="modal-room-id-copy-btn" class="copy-button" title="ID 복사">📄</button>
                </div>
            </div>
            <div id="participant-list" class="participant-list"></div>
            
            <button id="media-gallery-btn" class="modal-button secondary" style="width: 100%; margin-top: 15px;">미디어 보기</button>

            <div id="admin-controls" style="display: none;">
                <h3>관리자 설정</h3>
                <button id="add-member-btn" class="modal-button secondary">멤버 검색해서 추가</button>
                <button id="edit-room-btn" class="modal-button">채팅방 이름 변경</button>
                <button id="admin-delete-room-btn" class="modal-button danger">채팅방 삭제</button>
            </div>
        </div>
    </div>

    <div id="media-gallery-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button class="modal-close-btn">&times;</button>
            <h2>미디어 갤러리</h2>
            <div class="media-grid"></div>
        </div>
    </div>

    <div id="custom-prompt-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 id="custom-prompt-title"></h2>
            <p id="custom-prompt-text"></p>
            <input type="text" id="custom-prompt-input" style="display: none;">
            <div id="member-picker" style="display: none;">
                <input type="text" id="user-search" placeholder="사용자 검색..." class="search-input">
                <div id="search-results" class="search-results"></div>
                <div id="selected-members" class="selected-members"></div>
            </div>
            <div class="modal-actions">
                <button id="custom-prompt-cancel" class="modal-button secondary">취소</button>
                <button id="custom-prompt-ok" class="modal-button primary">확인</button>
            </div>
        </div>
    </div>

    <div id="edit-message-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button id="edit-modal-close-btn" class="modal-close-btn">&times;</button>
            <h2>메시지 수정</h2>
            <form id="edit-message-form">
                <textarea id="edit-message-input" rows="4" required></textarea>
                <div class="modal-actions">
                    <button type="button" id="edit-message-cancel" class="modal-button secondary">취소</button>
                    <button type="submit" class="modal-button primary">저장</button>
                </div>
            </form>
        </div>
    </div>

    <div id="user-profile-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button class="modal-close-btn" id="user-profile-close-btn">&times;</button>
            <button class="modal-edit-btn" id="user-profile-edit-btn" title="프로필 수정">✏️</button>
            <div class="profile-header">
                <div class="profile-photo-wrapper">
                    <img id="user-profile-photo" class="profile-photo" src="" alt="Profile Photo">
                    <label for="profile-photo-input" id="profile-photo-edit-overlay" style="display: none;">📷</label>
                    <input type="file" id="profile-photo-input" accept="image/*" style="display:none;">
                </div>
                <h2 id="user-profile-name-view"></h2>
                <input type="text" id="user-profile-name-edit" class="profile-input" style="display:none;">
                <p id="user-profile-status-view"></p>
                <select id="user-profile-status-edit" class="profile-select" style="display:none;">
                    <option value="Online">Online</option>
                    <option value="Available">Available</option>
                    <option value="At Desk">At Desk</option>
                    <option value="Working">Working</option>
                    <option value="Away from Desk">Away from Desk</option>
                    <option value="Be Right Back">Be Right Back</option>
                    <option value="On a Break">On a Break</option>
                    <option value="Stepped Out">Stepped Out</option>
                    <option value="Do Not Disturb">Do Not Disturb</option>
                    <option value="In a Meeting">In a Meeting</option>
                    <option value="On Lunch">On Lunch</option>
                    <option value="Out of Office">Out of Office</option>
                </select>
            </div>
            <div class="profile-details">
                <div class="profile-field">
                    <label>Email</label>
                    <div class="copyable-field">
                        <span id="user-profile-email-view"></span>
                        <input type="email" id="user-profile-email-edit" class="profile-input" style="display:none;">
                        <button class="copy-button" data-field="email" title="이메일 복사">📄</button>
                    </div>
                </div>
                <div class="profile-field">
                    <label>Phone</label>
                    <div class="copyable-field">
                        <span id="user-profile-phone-view"></span>
                        <input type="tel" id="user-profile-phone-edit" class="profile-input" style="display:none;">
                        <button class="copy-button" data-field="phone" title="전화번호 복사">📄</button>
                    </div>
                </div>
                <div class="profile-field">
                    <label>User ID</label>
                    <div class="copyable-field">
                        <span id="user-profile-id"></span>
                        <button class="copy-button" data-field="id" title="사용자 ID 복사">📄</button>
                    </div>
                </div>
            </div>
            <div id="profile-modal-actions" class="modal-actions" style="display:none;">
                <button id="profile-cancel-btn" class="modal-button secondary">취소</button>
                <button id="profile-save-btn" class="modal-button primary">저장</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>

    <!-- Main Application Logic -->
    <script src="app.js"></script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('firebase-messaging-sw.js')
                .then(registration => { console.log('Service Worker registered'); })
                .catch(error => { console.error('Service Worker registration failed:', error); });
        }
    </script>
</body>
</html>
